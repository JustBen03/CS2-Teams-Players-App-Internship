<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>CS2 Teams — Public</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<header class="header-bar">
    <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="22" class="ring"/>
            <path d="M32 8v8M32 48v8M8 32h8M48 32h8" class="ticks"/>
            <circle cx="32" cy="32" r="3" class="dot"/>
        </svg>
        <div class="brand-text">
            <h1 class="brand-title">CS2 Team Rankings</h1>
            <div class="brand-sub">Live roster overview • community project</div>
        </div>
    </div>
    <nav class="header-actions">
        <a class="btn" href="/admin">Admin</a>
    </nav>
</header>

<main>
    <div class="grid">
        <!-- Team card -->
        <div class="card" th:each="t : ${teams}">
            <div class="row">
                <img class="logo" th:if="${t.logoUrl}" th:src="${t.logoUrl}" alt="logo"/>
                <div>
                    <div class="title">
                        <div class="team-name" th:text="${t.name}"></div>
                        <div class="rank"
                             th:if="${t.worldRank != null}"
                             th:classappend="${t.worldRank <= 5} ? ' rank-top'">
                            <span>#</span><span th:text="${t.worldRank}"></span>
                        </div>
                    </div>
                    <div class="muted" th:if="${t.coachName}">
                        Coach: <span th:text="${t.coachName}"></span>
                    </div>
                    <div class="muted" th:text="${t.country}"></div>
                </div>
            </div>

            <!-- Active roster -->
            <table class="roster">
                <thead>
                <tr><th>Player</th><th>Role</th><th>Country</th><th>IGL</th></tr>
                </thead>
                <tbody>
                <tr class="player-row hoverable" th:each="m : ${t.memberships}" th:if="${m.active}">
                    <td>
                        <div class="player player-pop">
                            <a th:href="@{/players/{id}(id=${m.player.id})}" class="player-link">
                                <img class="avatar" th:if="${m.player.photoUrl}" th:src="${m.player.photoUrl}" alt="player"
                                     onerror="this.style.display='none'">
                                <span th:text="${m.player.nickname}"></span>
                            </a>

                            <!-- Popover -->
                            <div class="player-popover">
                                <div class="pop-row">
                                    <img class="pop-avatar" th:if="${m.player.photoUrl}" th:src="${m.player.photoUrl}" alt="player">
                                    <div class="pop-main">
                                        <div class="pop-head">
                                            <div class="pop-nick" th:text="${m.player.nickname}"></div>
                                        </div>
                                        <div class="pop-full muted" th:text="${m.player.fullName != null ? m.player.fullName : '—'}"></div>
                                    </div>
                                </div>

                                <div class="pop-line"></div>

                                <div class="pop-grid">
                                    <div>
                                        <div class="pop-label">Role</div>
                                        <div class="pop-value" th:text="${m.player.role != null ? m.player.role : '—'}"></div>
                                    </div>
                                    <div>
                                        <div class="pop-label">Age</div>
                                        <div class="pop-value" th:text="${m.player.age != null ? m.player.age : '—'}"></div>
                                    </div>
                                    <div>
                                        <div class="pop-label">Country</div>
                                        <div class="pop-value row" style="gap:6px">
                                            <img class="flag"
                                                 th:if="${m.player.countryCode}"
                                                 th:src="${'https://flagcdn.com/24x18/' + #strings.toLowerCase(m.player.countryCode) + '.png'}"
                                                 th:alt="${m.player.countryCode}">
                                            <span th:text="${m.player.country != null ? m.player.country : (m.player.countryCode != null ? m.player.countryCode : '—')}"></span>
                                        </div>
                                    </div>
                                    <div>
                                        <div class="pop-label">IGL</div>
                                        <div class="pop-value" th:text="${m.igl ? 'Yes' : 'No'}"></div>
                                    </div>
                                </div>
                            </div>
                            <!-- /Popover -->
                        </div>
                    </td>

                    <td><span class="chip" th:text="${m.player.role}"></span></td>

                    <td>
                        <div class="row" style="gap:6px">
                            <img class="flag"
                                 th:if="${m.player.countryCode}"
                                 th:src="${'https://flagcdn.com/24x18/' + #strings.toLowerCase(m.player.countryCode) + '.png'}"
                                 th:alt="${m.player.countryCode}">
                            <span th:text="${m.player.countryCode != null ? m.player.countryCode : ''}"></span>
                        </div>
                    </td>

                    <td><span th:if="${m.igl}" class="igl">IGL</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
